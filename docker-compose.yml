# Un solo comando levanta todo, sin credenciales externas ni archivo .env:
#     docker compose up --build
# Servicios: base PostgreSQL local + backend (http://localhost:8080, Swagger en /swagger-ui/index.html).
# Los valores por defecto sirven para desarrollo; se pueden pisar con un .env o con variables de entorno
# (por ejemplo para apuntar a Supabase). El broker (RabbitMQ de Core) está desactivado por defecto.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: transito
      POSTGRES_USER: transito
      POSTGRES_PASSWORD: transito
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transito -d transito"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: ${DB_URL:-jdbc:postgresql://db:5432/transito}
      DB_USER: ${DB_USER:-transito}
      DB_PASSWORD: ${DB_PASSWORD:-transito}
      JWT_SECRET: ${JWT_SECRET:-secreto-solo-para-desarrollo-local-de-32-bytes-minimo}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      CORE_RABBITMQ_ENABLED: ${CORE_RABBITMQ_ENABLED:-false}

  # Frontend (repo hermano): descomentar si está clonado al lado de este repo.
