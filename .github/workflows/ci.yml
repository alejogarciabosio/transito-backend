name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
    tags: [ 'v*' ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Correr tests y verificar cobertura minima 85%
        run: ./mvnw verify

  secretos:
    name: Escaneo de secretos (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2 (v2.3.9)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependencias:
    name: Escaneo de dependencias (Trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      # Se escanea el jar construido (dependencias reales y transitivas), no solo el pom.
      - name: Construir jar
        run: ./mvnw -B -q -DskipTests package
      - name: Trivy - falla con CVE HIGH/CRITICAL que tengan fix
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: rootfs
          scan-ref: target
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          version: 'v0.76.2'

  api-tests:
    name: Pruebas de API (Newman contra compose local)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Crear .env de desarrollo (valores ficticios generados en el runner)
        run: |
          {
            echo "DB_URL=jdbc:postgresql://db:5432/transito"
            echo "DB_USER=transito"
            echo "DB_PASSWORD=$(openssl rand -hex 12)"
            echo "JWT_SECRET=$(openssl rand -hex 32)"
            echo "CORS_ALLOWED_ORIGINS=http://localhost:3000,http://localhost:5173"
            echo "USERS_REST_ENABLED=false"
            echo "CORE_RABBITMQ_PASSWORD=$(openssl rand -hex 12)"
            echo "CORE_MODULE_SECRET=$(openssl rand -hex 12)"
          } > .env
      - name: Levantar el compose local (db, rabbitmq, mocks, backend)
        run: docker compose up --build -d
      - name: Esperar a que el backend esté UP
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/actuator/health >/dev/null && exit 0
            sleep 5
          done
          docker compose logs backend | tail -50
          exit 1
      - name: Correr Newman (colección Postman)
        run: tests/run-newman.sh
      - name: Subir reportes (JUnit y HTML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-reports
          path: tests/reports/
          retention-days: 7
      - name: Apagar el compose
        if: always()
        run: docker compose down -v

  sonarcloud:
    name: Análisis SonarCloud (Quality Gate)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      - name: Tests + reporte JaCoCo XML
        run: ./mvnw -B verify
      - name: Análisis SonarCloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          ./mvnw -B org.sonarsource.scanner.maven:sonar-maven-plugin:5.8.0.7211:sonar
          -Dsonar.organization=alejogarciabosio
          -Dsonar.projectKey=alejogarciabosio_transito-backend
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
          -Dsonar.qualitygate.wait=true
          -Dsonar.qualitygate.timeout=300

  zap-baseline:
    name: OWASP ZAP baseline (compose local, informativo)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Informativo: no bloquea el PR. zap-baseline.py corre con -I (las alertas WARN/Medium no fallan).
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Crear .env de desarrollo (valores ficticios generados en el runner)
        run: |
          {
            echo "DB_URL=jdbc:postgresql://db:5432/transito"
            echo "DB_USER=transito"
            echo "DB_PASSWORD=$(openssl rand -hex 12)"
            echo "JWT_SECRET=$(openssl rand -hex 32)"
            echo "CORS_ALLOWED_ORIGINS=http://localhost:3000,http://localhost:5173"
            echo "USERS_REST_ENABLED=false"
            echo "CORE_RABBITMQ_PASSWORD=$(openssl rand -hex 12)"
            echo "CORE_MODULE_SECRET=$(openssl rand -hex 12)"
          } > .env
      - name: Levantar el compose local
        run: docker compose up --build -d
      - name: Esperar a que el backend esté UP
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/actuator/health >/dev/null && exit 0
            sleep 5
          done
          docker compose logs backend | tail -50
          exit 1
      - name: ZAP baseline (ghcr.io/zaproxy/zaproxy:2.17.0)
        run: tests/run-zap.sh baseline
      - name: Subir reportes ZAP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-baseline
          path: tests/reports/zap/
          retention-days: 7
      - name: Apagar el compose
        if: always()
        run: docker compose down -v
