# Perfil de tests: base H2 en memoria (no toca Supabase) y secretos ficticios.
spring.application.name=transito-backend
spring.datasource.url=jdbc:h2:mem:transito;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;NON_KEYWORDS=CONDITION,VALUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
management.endpoints.web.exposure.include=health
jwt.secret=test-secret-de-al-menos-32-bytes-para-hs256-0123456789
jwt.expiration-minutes=120
cors.allowed-origins=http://localhost:5173
