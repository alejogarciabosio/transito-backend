spring.application.name=transito-backend
spring.datasource.url=jdbc:h2:mem:transito_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;NON_KEYWORDS=CONDITION,VALUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
management.endpoints.web.exposure.include=health
jwt.secret=test-secret-key-with-at-least-thirty-two-bytes
jwt.expiration-minutes=120
users.rest.enabled=false
cors.allowed-origins=http://localhost:5173
street-closures.expiration-enabled=false
# La suite usa infraestructura en memoria; nunca debe intentar conectarse al broker de Core.
core.rabbitmq.enabled=false
management.health.rabbit.enabled=false

# Igual que en main: Swagger con la API generada y el contrato curado.
springdoc.swagger-ui.urls[0].name=API completa (generada)
springdoc.swagger-ui.urls[0].url=/v3/api-docs
springdoc.swagger-ui.urls[1].name=Contrato del módulo (openapi.yaml)
springdoc.swagger-ui.urls[1].url=/openapi.yaml

# Contraseñas de los usuarios de prueba del StubIdentityValidator (solo tests; en main no hay valores).
# Indirección por test.users.* para no disparar el falso positivo generic-api-key de gitleaks.
test.users.ciudadano1=prueba-ciudadano1
test.users.inspector1=prueba-inspector1
test.users.admin1=prueba-admin1
stub.password.ciudadano1=${test.users.ciudadano1}
stub.password.inspector1=${test.users.inspector1}
stub.password.admin1=${test.users.admin1}
