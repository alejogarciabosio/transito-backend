spring.application.name=transito-backend
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
management.endpoints.web.exposure.include=health
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.maximum-pool-size=3
jwt.secret=${JWT_SECRET}
jwt.expiration-minutes=120
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
springdoc.swagger-ui.url=/openapi.yaml
# Habilitar únicamente cuando M3 confirme que requestedTo representa el fin operativo del corte.
street-closures.expiration.enabled=${STREET_CLOSURES_EXPIRATION_ENABLED:false}
street-closures.expiration.fixed-delay-ms=${STREET_CLOSURES_EXPIRATION_FIXED_DELAY_MS:60000}
