spring.application.name=transito-backend
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
management.endpoints.web.exposure.include=health
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.maximum-pool-size=3
jwt.secret=${JWT_SECRET}
jwt.expiration-minutes=120
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
springdoc.swagger-ui.url=/openapi.yaml
# Habilitar únicamente cuando M3 confirme que requestedTo representa el fin operativo del corte.
street-closures.expiration.enabled=${STREET_CLOSURES_EXPIRATION_ENABLED:false}
street-closures.expiration.fixed-delay-ms=${STREET_CLOSURES_EXPIRATION_FIXED_DELAY_MS:60000}
# Core Municipal / RabbitMQ. Se habilita al recibir URL y credenciales de testing.
core.integration.enabled=${CORE_INTEGRATION_ENABLED:false}
core.base-url=${CORE_BASE_URL:}
core.module-secret=${CORE_MODULE_SECRET:}
core.rabbitmq.incoming-queue=${CORE_RABBITMQ_INCOMING_QUEUE:q.transito}
core.rabbitmq.exchange=${CORE_RABBITMQ_EXCHANGE:muni.inbox}
spring.rabbitmq.host=${CORE_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${CORE_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${CORE_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${CORE_RABBITMQ_PASSWORD:guest}
spring.rabbitmq.virtual-host=${CORE_RABBITMQ_VHOST:/}
