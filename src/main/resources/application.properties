spring.application.name=transito-backend
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
management.endpoints.web.exposure.include=health
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.maximum-pool-size=3
jwt.secret=${JWT_SECRET}
jwt.expiration-minutes=120
# M1 expone autenticación REST. M7 conserva una fachada SOAP propia como adaptador académico.
users.rest.enabled=${USERS_REST_ENABLED:false}
# Validador local (users.rest.enabled=false): la contraseña de cada usuario de prueba sale de
# STUB_PASSWORD_CIUDADANO1, STUB_PASSWORD_INSPECTOR1 y STUB_PASSWORD_ADMIN1 (propiedad stub.password.<usuario>).
# Sin valor por defecto: si falta una, ese usuario queda deshabilitado (401). Ver docs/seguridad/credenciales.md.
users.rest.url=${USERS_REST_URL:https://ciudadanos-m1-backend.onrender.com/auth/usuario/login}
users.rest.timeout-ms=${USERS_REST_TIMEOUT_MS:5000}
users.soap-adapter.enabled=${USERS_SOAP_ADAPTER_ENABLED:true}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
# Swagger muestra dos definiciones: el contrato curado (openapi.yaml) y la API completa
# generada desde los controladores, que siempre refleja todos los endpoints reales.
springdoc.swagger-ui.urls[0].name=API completa (generada)
springdoc.swagger-ui.urls[0].url=/v3/api-docs
springdoc.swagger-ui.urls[1].name=Contrato del módulo (openapi.yaml)
springdoc.swagger-ui.urls[1].url=/openapi.yaml

# La integración se activa sólo de forma explícita en el ambiente autorizado por Core.
# Core exige AMQPS, validación de certificado y verificación del nombre de host.
# core.module-secret: el "secret de máquina" que entrega Core; se usa para pedir el token
# de módulo en POST {core.base-url}/api/v1/auth/module-token (dura 15 minutos, sin refresh).
core.base-url=${CORE_BASE_URL:https://core-uade-2026.duckdns.org}
core.module-secret=${CORE_MODULE_SECRET:}
core.rabbitmq.enabled=${CORE_RABBITMQ_ENABLED:false}
# Registra al iniciar el catálogo de todos los eventos emitidos por Tránsito.
# Desactivable únicamente para diagnósticos: CORE_PUBLICATIONS_REGISTRATION_ENABLED=false.
core.publications.registration.enabled=${CORE_PUBLICATIONS_REGISTRATION_ENABLED:true}
core.rabbitmq.exchange=muni.inbox
core.rabbitmq.queue=q.transito
spring.rabbitmq.host=${CORE_RABBITMQ_HOST:core-uade-2026.duckdns.org}
spring.rabbitmq.port=${CORE_RABBITMQ_PORT:5671}
spring.rabbitmq.virtual-host=${CORE_RABBITMQ_VHOST:core}
spring.rabbitmq.username=${CORE_RABBITMQ_USERNAME:module_transito}
spring.rabbitmq.password=${CORE_RABBITMQ_PASSWORD:}
spring.rabbitmq.ssl.enabled=${CORE_RABBITMQ_TLS_ENABLED:true}
spring.rabbitmq.ssl.validate-server-certificate=true
spring.rabbitmq.ssl.verify-hostname=true
# Ante un error del manejador Spring hace nack(requeue=false); Core aplica su backoff y DLQ.
spring.rabbitmq.listener.simple.default-requeue-rejected=false
# RabbitMQ nunca entra en /actuator/health: con el broker de Core inalcanzable el indicador esperaba el
# timeout de conexión y el chequeo de salud se colgaba. Un broker caído no debe tumbar la salud de M7
# (el listener se reconecta solo).
management.health.rabbit.enabled=false
street-closures.expiration-enabled=${STREET_CLOSURES_EXPIRATION_ENABLED:true}
street-closures.expiration-check-ms=${STREET_CLOSURES_EXPIRATION_CHECK_MS:60000}

# IA opcional (sugerencia de tipo/agravantes). Apagada por defecto; la clave solo por variable de entorno.
ai.enabled=${AI_ENABLED:false}
ai.groq.api-key=${GROQ_API_KEY:}
ai.model=${AI_MODEL:llama-3.1-8b-instant}
ai.timeout-ms=${AI_TIMEOUT_MS:5000}

# Transactional Outbox (DEF-14 / DEF-04): los eventos se guardan en outbox_events dentro de la transacción
# de negocio y un relay los publica a Core cada interval-ms. Reintentos con backoff exponencial; FAILED tras max-attempts.
outbox.relay.enabled=${OUTBOX_RELAY_ENABLED:true}
outbox.relay.interval-ms=${OUTBOX_RELAY_INTERVAL_MS:2000}
outbox.relay.max-attempts=${OUTBOX_RELAY_MAX_ATTEMPTS:15}
outbox.relay.batch-size=50
outbox.relay.backoff-base-ms=2000
outbox.relay.backoff-max-ms=60000
outbox.relay.lease-ms=30000
# Dos hilos de @Scheduled: el relay y el vencimiento de cortes no se esperan entre sí.
spring.task.scheduling.pool.size=2
# Con el broker caído, el relay no queda colgado el timeout por defecto (60 s) en cada intento.
spring.rabbitmq.connection-timeout=${RABBITMQ_CONNECTION_TIMEOUT:10s}
