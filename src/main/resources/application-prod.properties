# Perfil "prod": solo se activa con SPRING_PROFILES_ACTIVE=prod (variable que ya existe en Railway; no se renombra).
# Oculta la API generada por springdoc y Swagger UI en producción (hallazgo de ZAP / aviso de SpringDoc).
# El contrato curado /openapi.yaml sigue publicado como recurso estático. El frontend no usa estos endpoints.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
