<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-labelledby="title desc">
  <title id="title">Diagrama de secuencia actualizado — Módulo 7 Tránsito</title>
  <desc id="desc">Login síncrono con Usuarios y confirmación asíncrona de infracción hacia Rentas mediante Core.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0369a1"/></marker>
    <style>
      .bg { fill:#f8fafc; } .head { fill:#0f172a; } .section { fill:#e0f2fe; stroke:#0284c7; stroke-width:1.5; }
      .actor { fill:#ffffff; stroke:#334155; stroke-width:1.5; } .life { stroke:#94a3b8; stroke-width:1.5; stroke-dasharray:7 7; }
      .msg { stroke:#334155; stroke-width:2; marker-end:url(#arrow); } .async { stroke:#0369a1; stroke-width:2.5; stroke-dasharray:8 5; marker-end:url(#arrow-blue); }
      .return { stroke:#475569; stroke-width:1.8; stroke-dasharray:6 5; marker-end:url(#arrow); } .box { fill:#f1f5f9; stroke:#94a3b8; stroke-width:1.2; }
      text { font-family:Arial, Helvetica, sans-serif; fill:#0f172a; } .title { font-size:28px; font-weight:700; } .subtitle { font-size:16px; fill:#475569; }
      .actorText { font-size:15px; font-weight:700; text-anchor:middle; } .label { font-size:15px; } .small { font-size:13px; fill:#475569; } .sectionText { font-size:19px; font-weight:700; }
    </style>
  </defs>
  <rect class="bg" width="1600" height="1080" rx="18"/>
  <text x="800" y="45" text-anchor="middle" class="title">M7 Tránsito — diagrama de secuencia actualizado</text>
  <text x="800" y="72" text-anchor="middle" class="subtitle">Autenticación síncrona con M1 y confirmación asíncrona de infracción hacia M5</text>

  <g>
    <rect class="actor" x="55" y="105" width="150" height="52" rx="9"/><text class="actorText" x="130" y="136">Usuario</text>
    <rect class="actor" x="275" y="105" width="160" height="52" rx="9"/><text class="actorText" x="355" y="136">Frontend</text>
    <rect class="actor" x="515" y="105" width="170" height="52" rx="9"/><text class="actorText" x="600" y="136">API M7</text>
    <rect class="actor" x="765" y="105" width="170" height="52" rx="9"/><text class="actorText" x="850" y="128">M1 Usuarios</text><text class="small" x="850" y="146" text-anchor="middle">SOAP opcional</text>
    <rect class="actor" x="1015" y="105" width="150" height="52" rx="9"/><text class="actorText" x="1090" y="136">Base M7</text>
    <rect class="actor" x="1245" y="105" width="170" height="52" rx="9"/><text class="actorText" x="1330" y="128">Core / RabbitMQ</text><text class="small" x="1330" y="146" text-anchor="middle">muni.inbox</text>
    <rect class="actor" x="1450" y="105" width="120" height="52" rx="9"/><text class="actorText" x="1510" y="136">M5 Rentas</text>
    <line class="life" x1="130" y1="157" x2="130" y2="1025"/><line class="life" x1="355" y1="157" x2="355" y2="1025"/>
    <line class="life" x1="600" y1="157" x2="600" y2="1025"/><line class="life" x1="850" y1="157" x2="850" y2="1025"/>
    <line class="life" x1="1090" y1="157" x2="1090" y2="1025"/><line class="life" x1="1330" y1="157" x2="1330" y2="1025"/>
    <line class="life" x1="1510" y1="157" x2="1510" y2="1025"/>
  </g>

  <rect class="section" x="42" y="185" width="1516" height="352" rx="12"/>
  <text class="sectionText" x="68" y="218">1. Inicio de sesión — flujo síncrono</text>
  <line class="msg" x1="130" y1="257" x2="355" y2="257"/><text class="label" x="184" y="247">1. Ingresa credenciales</text>
  <line class="msg" x1="355" y1="302" x2="600" y2="302"/><text class="label" x="403" y="292">2. POST /api/v1/auth/login</text>
  <rect class="box" x="630" y="330" width="278" height="107" rx="8"/>
  <text class="label" x="647" y="355" font-weight="700">¿USERS_SOAP_ENABLED=true?</text>
  <text class="small" x="647" y="379">Sí: validateUser(dni, password)</text><text class="small" x="647" y="400">No: proveedor local de desarrollo</text><text class="small" x="647" y="421">Timeout: 5 segundos</text>
  <line class="msg" x1="600" y1="462" x2="850" y2="462"/><text class="label" x="645" y="452">3. SOAP validateUser</text>
  <line class="return" x1="850" y1="502" x2="600" y2="502"/><text class="label" x="650" y="492">4. user_id, dni, role, auth</text>
  <line class="return" x1="600" y1="522" x2="355" y2="522"/><text class="label" x="420" y="512">5. 200 JWT / 401 / 502 / 503</text>

  <rect class="section" x="42" y="565" width="1516" height="430" rx="12"/>
  <text class="sectionText" x="68" y="598">2. Confirmación de infracción — flujo asíncrono</text>
  <text class="small" x="68" y="622">Sólo ADMINISTRADOR puede confirmar. La respuesta REST no espera a que Rentas procese el evento.</text>
  <line class="msg" x1="130" y1="662" x2="355" y2="662"/><text class="label" x="178" y="652">1. Confirma infracción</text>
  <line class="msg" x1="355" y1="707" x2="600" y2="707"/><text class="label" x="388" y="697">2. POST /infractions/{id}/confirmation</text>
  <line class="msg" x1="600" y1="752" x2="1090" y2="752"/><text class="label" x="730" y="742">3. Estado → CONFIRMED</text>
  <line class="return" x1="1090" y1="792" x2="600" y2="792"/><text class="small" x="760" y="782">4. Persistencia confirmada</text>
  <line class="return" x1="600" y1="832" x2="355" y2="832"/><text class="label" x="415" y="822">5. 200 InfractionResponse</text>
  <line class="async" x1="600" y1="877" x2="1330" y2="877"/><text class="label" x="795" y="867" fill="#0369a1">6. infractionConfirmed — envelope Core 1.0</text>
  <line class="async" x1="1330" y1="922" x2="1510" y2="922"/><text class="label" x="1350" y="912" fill="#0369a1">7. Entrega a M5</text>
  <rect class="box" x="1045" y="942" width="480" height="35" rx="7"/><text class="small" x="1060" y="965">Pendiente operativo: credenciales/IP Core y prueba bilateral M7 → Core → M5.</text>
</svg>
