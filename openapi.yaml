components:
  schemas:
    UpdateParkingZoneRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 120
          minLength: 0
        boundaries:
          type: string
          maxLength: 255
          minLength: 0
        allowedHours:
          type: string
          maxLength: 255
          minLength: 0
        status:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
      required:
      - allowedHours
      - boundaries
      - name
      - status
    ParkingZoneResponse:
      type: object
      properties:
        zoneId:
          type: string
          format: uuid
        name:
          type: string
        boundaries:
          type: string
        allowedHours:
          type: string
        status:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
    UpdateParkingTariffRequest:
      type: object
      properties:
        pricePerHour:
          type: number
          minimum: 0.01
        validFrom:
          type: string
          format: date
        validTo:
          type: string
          format: date
        dateRangeValid:
          type: boolean
      required:
      - pricePerHour
      - validFrom
    ParkingTariffResponse:
      type: object
      properties:
        tariffId:
          type: string
          format: uuid
        zoneId:
          type: string
          format: uuid
        pricePerHour:
          type: number
        validFrom:
          type: string
          format: date
        validTo:
          type: string
          format: date
        status:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
    RejectClosureRequest:
      type: object
      properties:
        rejectionReason:
          type: string
          maxLength: 1000
          minLength: 0
      required:
      - rejectionReason
    Detour:
      type: object
      properties:
        street:
          type: string
          maxLength: 255
          minLength: 0
        alternateRoute:
          type: string
          maxLength: 255
          minLength: 0
      required:
      - alternateRoute
      - street
    StreetClosureResponse:
      type: object
      properties:
        streetClosureId:
          type: string
          format: uuid
        closureRequestId:
          type: string
        requestingModule:
          type: string
          enum:
          - OBRAS
          - AMBIENTE
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        affectedStreet:
          type: array
